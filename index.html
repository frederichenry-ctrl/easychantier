<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChantierIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-full">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isRecordingModalOpen, setIsRecordingModalOpen] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [transcript, setTranscript] = useState('');

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, isRecordingModalOpen]);

            const handleStartRecording = () => {
                setIsRecording(true);
                setTranscript("Enregistrement en cours...");
                setTimeout(() => {
                    setTranscript("Constat lot 2 : Plaques posées. Fuite d'eau constatée logement 302, prévoir coffrage additionnel de 400€.");
                }, 1500);
            };

            const handleStopRecording = () => {
                setIsRecording(false);
            };

            return (
                <div className="flex h-full w-full bg-slate-950 text-slate-100 font-sans overflow-hidden">
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative max-w-md mx-auto w-full border-x border-slate-800">
                        
                        {/* Header */}
                        <header className="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between">
                            <div>
                                <span className="text-[10px] font-bold text-blue-400 uppercase tracking-wider block">Résidence Les Pins</span>
                                <h2 className="text-sm font-bold text-white">Chantier N°302</h2>
                            </div>
                            <div className="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xs">IA</div>
                        </header>

                        {/* Main Content */}
                        <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-28">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-4">
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                                        <span className="text-xs text-slate-400">Progression globale</span>
                                        <div className="text-2xl font-bold">72 %</div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                            <div className="bg-blue-500 h-full w-[72%]"></div>
                                        </div>
                                    </div>

                                    <div onClick={() => setIsRecordingModalOpen(true)} className="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-2xl p-4 flex items-center justify-between cursor-pointer">
                                        <div>
                                            <span className="text-xs font-bold text-blue-400 uppercase">Assistant Vocal</span>
                                            <h3 className="text-sm font-semibold text-white">Dictée vocale chantier</h3>
                                        </div>
                                        <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center">🎙️</div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'reports' && (
                                <div className="space-y-3">
                                    <h2 className="text-sm font-bold">Comptes-Rendus Générés</h2>
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                                        <span className="text-xs text-blue-400 font-bold">CR #14 - Validation Chape</span>
                                        <p className="text-xs text-slate-300">Pose des cloisons effectuée. Léger retard sur le raccordement électrique.</p>
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* Modal Vocal */}
                        {isRecordingModalOpen && (
                            <div className="fixed inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-between">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-blue-400">Copilote Vocal IA</span>
                                    <button onClick={() => setIsRecordingModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                                </div>
                                <div className="text-center space-y-4">
                                    <button 
                                        onClick={isRecording ? handleStopRecording : handleStartRecording}
                                        className={`w-20 h-20 rounded-full ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-blue-600'} text-white font-bold mx-auto flex items-center justify-center text-xl`}
                                    >
                                        🎙️
                                    </button>
                                    <p className="text-xs text-slate-300 italic">{transcript || "Appuyez sur le micro et parlez..."}</p>
                                </div>
                                <button onClick={() => { setIsRecordingModalOpen(false); setActiveTab('reports'); }} className="w-full bg-blue-600 text-white py-3 rounded-xl text-xs font-bold">
                                    Générer le rapport par IA
                                </button>
                            </div>
                        )}

                        {/* Bottom Nav */}
                        <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-slate-950/90 border-t border-slate-800 flex justify-around text-xs">
                            <button onClick={() => setActiveTab('dashboard')} className={activeTab === 'dashboard' ? 'text-blue-400 font-bold' : 'text-slate-400'}>Accueil</button>
                            <button onClick={() => setIsRecordingModalOpen(true)} className="text-blue-500 font-bold">🎙️ Micro</button>
                            <button onClick={() => setActiveTab('reports')} className={activeTab === 'reports' ? 'text-blue-400 font-bold' : 'text-slate-400'}>Rapports</button>
                        </nav>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
